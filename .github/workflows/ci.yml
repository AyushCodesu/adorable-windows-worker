name: Worker CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check worker scripts
        run: bunx tsc --noEmit
      - name: Validate worker scripts integrity & syntax
        run: bun run scripts/ci-validate.ts
